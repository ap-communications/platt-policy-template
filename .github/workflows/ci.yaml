name: CI
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * 4'

jobs:
  build:
    name: Continuous Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest

      - name: Set up Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: latest

      - name: format
        run: |
          opa fmt policies --fail --diff
          opa fmt samples --fail --diff
      - name: check
        run: opa check policies samples
      - name: lint
        run: regal lint --format=github policies samples
      - name: test
        run: opa test -v policies samples
